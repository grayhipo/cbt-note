name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build SPA (outputs to dist/app/)
        run: npm run build

      - name: Copy static pages into dist/
        run: |
          cp static/index.html dist/index.html
          cp static/CNAME dist/CNAME
          mkdir -p dist/about dist/privacy
          cp static/about/index.html dist/about/index.html
          cp static/privacy/index.html dist/privacy/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
