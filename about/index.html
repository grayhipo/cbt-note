<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CBTとは？ | CBT Note</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/assets/style.css" />
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div style="display: flex; align-items: center; gap: 10px">
          <a href="/cbt-note/" style="background: none; border: none; font-size: 1.2rem; color: var(--text-muted); padding: 0 4px; text-decoration: none">←</a>
          <a href="/cbt-note/" class="header-title" style="text-decoration: none">思考記録</a>
        </div>
      </div>
      <div style="max-width: 640px; margin: 0 auto; padding: 20px;">
        <div class="card">
          <h1 class="step-title" style="margin-bottom: 16px">認知行動療法（CBT）とは？</h1>
          <div style="line-height: 1.8; color: var(--text)">
            <p style="margin-bottom: 1em">
              認知行動療法（CBT: Cognitive Behavioral Therapy）は、ストレスなどで凝り固まってしまった考え方や行動を、少しずつ解きほぐしていく心理療法です。
            </p>
            <p style="margin-bottom: 1em">
              私たちは、ある出来事に遭遇したとき、瞬間的に何らかの考え（自動思考）が浮かびます。この自動思考が、悲しみや怒りといった感情を引き起こします。
            </p>
            <p>
              思考記録をつけることで、自分の自動思考に気づき、それが現実に即しているかを検証（根拠と反証）し、よりバランスの取れた考え（適応的思考）を見つける練習ができます。
            </p>
          </div>
        </div>
        <div style="text-align: center; margin-top: 20px">
          <a href="/cbt-note/" class="btn btn-primary" style="text-decoration: none; display: inline-block">ホームに戻る</a>
        </div>
      </div>
    </div>
  </body>
</html>
