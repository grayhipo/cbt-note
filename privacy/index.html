<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>プライバシーポリシー | CBT Note</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/assets/style.css" />
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div style="display: flex; align-items: center; gap: 10px">
          <a href="/cbt-note/" style="background: none; border: none; font-size: 1.2rem; color: var(--text-muted); padding: 0 4px; text-decoration: none">←</a>
          <a href="/cbt-note/" class="header-title" style="text-decoration: none">思考記録</a>
        </div>
      </div>
      <div style="max-width: 640px; margin: 0 auto; padding: 20px;">
        <div class="card">
          <h1 class="step-title" style="margin-bottom: 16px">プライバシーポリシー</h1>
          <div style="line-height: 1.8; color: var(--text)">
            <p style="margin-bottom: 1em">
              当アプリ「思考記録」は、ユーザーの入力したデータをブラウザのローカルストレージ（LocalStorage）にのみ保存します。
            </p>
            <p>
              サーバーへの送信や、第三者へのデータ提供は一切行われません。データはお使いの端末内にのみ存在し、ブラウザのキャッシュ削除等で消去されます。
            </p>
          </div>
        </div>
        <div style="text-align: center; margin-top: 20px">
          <a href="/cbt-note/" class="btn btn-primary" style="text-decoration: none; display: inline-block">ホームに戻る</a>
        </div>
      </div>
    </div>
  </body>
</html>
